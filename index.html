<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BON! Café</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ivory:#F7F1E4;
  --linen:#EFE3CD;
  --espresso:#1D130E;
  --espresso-2:#2A1C15;
  --chocolate:#35211A;
  --caramel:#B87A3D;
  --caramel-2:#DDA463;
  --burgundy:#6E2A38;
  --ink:#241811;
  --ink-soft:#6E5B4C;
  --paper:#F7F1E4;
  --paper-soft:#C9B49A;
  --line:rgba(36,24,17,.14);
  --line-dark:rgba(247,241,228,.16);
  color-scheme:light;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--ivory);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',Georgia,'Times New Roman',serif;
  font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em;
}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
img,svg{display:block;max-width:100%;}
::selection{background:var(--caramel);color:var(--ivory);}
:focus-visible{outline:2px solid var(--caramel);outline-offset:3px;}

.eyebrow{
  font-size:.75rem;text-transform:uppercase;letter-spacing:.22em;
  font-weight:600;color:var(--caramel);
}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(1.25rem,4vw,4rem);}
section[id],header[id]{scroll-margin-top:6.5rem;}
.dark{background:var(--espresso);color:var(--paper);}
.dark .eyebrow{color:var(--caramel-2);}
.dark .ink-soft{color:var(--paper-soft);}
.ink-soft{color:var(--ink-soft);}

/* ---------- grain ---------- */
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  animation:grain 1.1s steps(4) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0);} 25%{transform:translate(-1%,1%);}
  50%{transform:translate(1%,-1%);} 75%{transform:translate(-1%,-1%);}
  100%{transform:translate(0,0);}
}

/* ---------- custom cursor ---------- */
#cursor-dot,#cursor-ring{
  position:fixed;top:0;left:0;pointer-events:none;z-index:9999;
  border-radius:50%;transform:translate(-50%,-50%);
}
#cursor-dot{width:6px;height:6px;background:var(--ink);transition:background .3s;}
#cursor-ring{
  width:44px;height:44px;border:1px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  transition:width .35s cubic-bezier(.16,1,.3,1),height .35s cubic-bezier(.16,1,.3,1),
    border-color .35s,background .35s;
}
#cursor-ring.on-dark{border-color:var(--paper);}
#cursor-ring.on-dark #cursor-label{color:var(--paper);}
#cursor-label{
  font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);opacity:0;transition:opacity .25s;font-weight:600;
}
#cursor-ring.expand{width:96px;height:96px;background:rgba(184,122,61,.12);border-color:var(--caramel);}
#cursor-ring.expand #cursor-label{opacity:1;}
@media (hover:none),(pointer:coarse){
  #cursor-dot,#cursor-ring{display:none;}
}

/* ---------- preloader ---------- */
#preloader{
  position:fixed;inset:0;background:var(--espresso);color:var(--paper);
  z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.1rem;transition:opacity .8s ease,visibility .8s;
}
#preloader.hide{opacity:0;visibility:hidden;pointer-events:none;}
#preloader .mark{font-family:'Fraunces',serif;font-size:2.75rem;letter-spacing:-.01em;opacity:0;
  animation:markIn 1s .15s forwards ease-out;}
#preloader .sub{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--paper-soft);
  opacity:0;animation:subIn 1s .6s forwards ease-out;}
#preloader .bar{width:120px;height:1px;background:var(--line-dark);overflow:hidden;margin-top:.4rem;}
#preloader .bar i{display:block;height:100%;width:0%;background:var(--caramel);animation:load 1.6s .2s forwards cubic-bezier(.7,0,.3,1);}
@keyframes markIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes subIn{from{opacity:0;}to{opacity:1;}}
@keyframes load{to{width:100%;}}

/* ---------- nav ---------- */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:900;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.6rem clamp(1.25rem,4vw,3rem);
  transition:padding .5s cubic-bezier(.16,1,.3,1),background .5s,box-shadow .5s;
}
#nav .brand{font-family:'Fraunces',serif;font-size:1.35rem;letter-spacing:-.01em;color:var(--paper);}
#nav .links{display:flex;gap:2.1rem;list-style:none;margin:0;padding:0;}
#nav .links a{
  font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-soft);
  position:relative;padding-bottom:2px;
}
#nav .links a::after{
  content:'';position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--caramel-2);
  transition:width .35s cubic-bezier(.16,1,.3,1);
}
#nav .links a:hover::after{width:100%;}
#nav .links a:hover{color:var(--paper);}
#nav .right{display:flex;align-items:center;gap:1.1rem;}
#nav .ig{font-size:.78rem;color:var(--paper-soft);letter-spacing:.06em;}
#nav .ig:hover{color:var(--paper);}
#nav .cta{
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--espresso);
  background:var(--paper);padding:.65rem 1.3rem;border-radius:100px;font-weight:600;
  transition:transform .3s cubic-bezier(.16,1,.3,1),background .3s;
}
#nav .cta:hover{background:var(--caramel-2);transform:translateY(-1px);}
#nav.scrolled{
  top:.9rem;left:50%;right:auto;transform:translateX(-50%);
  width:min(960px,92vw);padding:.7rem 1.6rem;border-radius:100px;
  background:rgba(29,19,14,.62);backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--line-dark);box-shadow:0 12px 40px rgba(0,0,0,.28);
}
.langsw{display:flex;gap:.2rem;font-size:.7rem;letter-spacing:.04em;font-weight:600;}
.langsw button{padding:.35rem .55rem;border-radius:100px;color:var(--paper-soft);text-transform:uppercase;transition:color .25s,background .25s;}
.langsw button.active{color:var(--espresso);background:var(--paper);}
.langsw button:hover:not(.active){color:var(--paper);}
@media (max-width:860px){
  #nav .links{display:none;}
  #nav.scrolled{width:min(420px,90vw);}
}

/* ---------- hero ---------- */
#hero{
  position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--espresso);
  overflow:hidden;padding-bottom:clamp(2.5rem,6vw,4.5rem);
}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;opacity:.55;}
.hero-tint{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 76% 18%,rgba(221,164,99,.30),transparent 60%),
    radial-gradient(ellipse 60% 45% at 15% 85%,rgba(110,42,56,.28),transparent 60%),
    linear-gradient(180deg,#140D09 0%,rgba(29,19,14,.86) 46%,#241812 100%);
}
#hero-parallax{position:absolute;inset:-6%;will-change:transform;}
.steam{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;}
.steam.s1{width:36vw;height:36vw;top:-6%;right:6%;background:radial-gradient(circle,rgba(221,164,99,.35),transparent 70%);animation:drift 14s ease-in-out infinite;}
.steam.s2{width:26vw;height:26vw;bottom:0%;left:2%;background:radial-gradient(circle,rgba(110,42,56,.3),transparent 70%);animation:drift 18s ease-in-out infinite reverse;}
@keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(2%,4%);}}
.hero-copy{position:relative;z-index:3;}
.hero-copy .eyebrow{color:var(--caramel-2);}
h1.hero-title{
  color:var(--paper);font-size:clamp(4.2rem,17vw,11.5rem);line-height:.86;letter-spacing:-.02em;
  margin-top:.5rem;
}
.hero-sub{
  font-family:'Fraunces',serif;font-style:italic;font-weight:400;
  color:var(--paper);font-size:clamp(1.35rem,3vw,2.1rem);margin-top:1rem;max-width:26ch;
}
.hero-desc{color:var(--paper-soft);font-size:1.02rem;margin-top:1.1rem;max-width:38ch;}
.hero-ctas{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2.4rem;}
.btn{
  display:inline-flex;align-items:center;gap:.6rem;font-size:.76rem;letter-spacing:.12em;
  text-transform:uppercase;font-weight:600;padding:1rem 1.7rem;border-radius:100px;
  transition:transform .4s cubic-bezier(.16,1,.3,1),background .3s,color .3s,border-color .3s;
}
.btn-solid{background:var(--paper);color:var(--espresso);}
.btn-solid:hover{background:var(--caramel-2);transform:translateY(-2px);}
.btn-line{border:1px solid var(--line-dark);color:var(--paper);}
.btn-line:hover{border-color:var(--paper);transform:translateY(-2px);}
.btn .arrow{transition:transform .35s cubic-bezier(.16,1,.3,1);}
.btn:hover .arrow{transform:translateX(4px);}
.scroll-cue{
  position:absolute;bottom:1.6rem;left:clamp(1.25rem,4vw,4rem);display:flex;align-items:center;gap:.7rem;
  color:var(--paper-soft);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
}
.scroll-cue i{width:1px;height:26px;background:var(--line-dark);position:relative;overflow:hidden;display:block;}
.scroll-cue i::after{content:'';position:absolute;left:0;top:-100%;width:100%;height:100%;background:var(--caramel-2);animation:cue 2.2s ease-in-out infinite;}
@keyframes cue{0%{top:-100%;}50%{top:0;}100%{top:100%;}}

/* reveal on scroll */
[data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);}
[data-reveal].in{opacity:1;transform:translateY(0);}
[data-reveal="scale"]{transform:scale(.94);}
[data-reveal="scale"].in{transform:scale(1);}

/* ---------- marquee ---------- */
.marquee{padding:1.5rem 0;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--linen);}
.marquee .track{display:flex;width:max-content;gap:2.5rem;animation:mq 26s linear infinite;}
.marquee span{
  font-family:'Fraunces',serif;font-size:clamp(1.4rem,4vw,2.6rem);white-space:nowrap;color:var(--ink);
  display:flex;align-items:center;gap:2.5rem;
}
.marquee span i{width:8px;height:8px;border-radius:50%;background:var(--caramel);display:inline-block;}
@keyframes mq{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ---------- intro ---------- */
#intro{padding:clamp(6rem,12vw,10rem) 0;}
.intro-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(2rem,6vw,5rem);align-items:center;}
.intro-grid h2{font-size:clamp(2.3rem,5.4vw,4rem);line-height:1.05;}
.intro-grid p.lead{margin-top:1.6rem;font-size:1.15rem;color:var(--ink-soft);max-width:44ch;line-height:1.75;}
.intro-stats{display:flex;gap:clamp(1.5rem,4vw,3rem);margin-top:2.5rem;flex-wrap:wrap;}
.intro-stats div b{display:block;font-family:'Fraunces',serif;font-size:2rem;color:var(--burgundy);}
.intro-stats div span{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);}
.panel{
  position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;
  background:#1D130E;
}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.panel::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(0,0,0,.4);}

/* ---------- shelves (coffee / bakery / breakfast / summer) ---------- */
.shelf-section{padding:clamp(5rem,10vw,8rem) 0;position:relative;overflow:hidden;}
.shelf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap;margin-bottom:2.6rem;}
.shelf-head h2{font-size:clamp(3.2rem,10vw,7.5rem);line-height:.9;}
.shelf-head p{max-width:34ch;font-size:1rem;}
.shelf{
  display:flex;gap:1.4rem;overflow-x:auto;overscroll-behavior-x:contain;
  padding:.5rem clamp(1.25rem,4vw,4rem) 1.5rem;margin:0 calc(-1*clamp(1.25rem,4vw,4rem));
  scroll-snap-type:x proximity;scroll-padding-left:clamp(1.25rem,4vw,4rem);scrollbar-width:none;
}
.shelf::-webkit-scrollbar{display:none;}
.card{
  scroll-snap-align:start;flex:0 0 auto;width:min(84vw,300px);
  border-top:1px solid var(--line);padding-top:1.2rem;
  transition:transform .5s cubic-bezier(.16,1,.3,1);
}
@media (max-width:520px){
  .card{width:86vw;}
}
.dark .card{border-color:var(--line-dark);}
.card:hover{transform:translateY(-6px) rotate(-.4deg);}
.card .icon{width:52px;height:52px;color:var(--caramel);margin-bottom:1.3rem;}
.dark .card .icon{color:var(--caramel-2);}
.card .cat{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
.dark .card .cat{color:var(--paper-soft);}
.card h3{font-size:1.25rem;margin-top:.5rem;}
.card p{font-size:.86rem;color:var(--ink-soft);margin-top:.5rem;line-height:1.5;}
.dark .card p{color:var(--paper-soft);}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.1rem;padding-top:1rem;border-top:1px dashed var(--line);}
.dark .card .meta{border-color:var(--line-dark);}
.card .price{font-family:'Fraunces',serif;font-size:1.15rem;font-variant-numeric:tabular-nums;}
.card .vol{font-size:.72rem;color:var(--ink-soft);}
.dark .card .vol{color:var(--paper-soft);}

/* ---------- desserts (overlap) ---------- */
#desserts{padding:clamp(5rem,10vw,8rem) 0;}
.dessert-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem 1.2rem;margin-top:3rem;}
.d-card{position:relative;border-radius:4px;padding:1.5rem 1.3rem;background:var(--espresso-2);border:1px solid var(--line-dark);}
.d-card.big{grid-column:span 3;grid-row:span 2;padding:2.2rem;}
.d-card.med{grid-column:span 3;}
.d-card.small{grid-column:span 2;}
.d-card .glyph{width:38px;height:38px;color:var(--caramel-2);margin-bottom:1rem;}
.d-card.big .glyph{width:56px;height:56px;}
.d-card h3{color:var(--paper);font-size:1.15rem;}
.d-card.big h3{font-size:1.9rem;}
.d-card p{color:var(--paper-soft);font-size:.82rem;margin-top:.5rem;line-height:1.5;}
.d-card .meta{margin-top:1rem;display:flex;justify-content:space-between;color:var(--paper);font-size:.85rem;font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;}
@media (max-width:820px){
  .dessert-grid{grid-template-columns:repeat(2,1fr);}
  .d-card.big,.d-card.med,.d-card.small{grid-column:span 1;grid-row:auto;}
}

/* ---------- featured product ---------- */
#featured{padding:clamp(6rem,14vw,11rem) 0;background:var(--linen);overflow:hidden;position:relative;}
.feat-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(2rem,6vw,5rem);align-items:center;}
.feat-grid .eyebrow{margin-bottom:.6rem;}
.feat-grid h2{font-size:clamp(3rem,8vw,6rem);line-height:.92;color:var(--burgundy);}
.feat-grid p.lead{margin-top:1.3rem;font-size:1.1rem;max-width:36ch;color:var(--ink-soft);}
.feat-price{font-family:'Fraunces',serif;font-size:2rem;margin-top:1.6rem;font-variant-numeric:tabular-nums;}
.feat-panel{aspect-ratio:1/1;border-radius:6px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#8FA06A,transparent 55%),radial-gradient(circle at 70% 75%,#D9A15E,transparent 60%),linear-gradient(150deg,#EADFC5,#C9B586);}
.feat-panel svg{position:absolute;inset:0;width:100%;height:100%;}

/* ---------- summer ---------- */
#summer{padding:clamp(5rem,10vw,8rem) 0;background:linear-gradient(180deg,#2A1C15 0%,#3E4A34 55%,#F2E7C9 100%);color:var(--paper);}
#summer .shelf-head h2{color:var(--paper);}
#summer .shelf-head p{color:var(--paper-soft);}
#summer .card{border-color:var(--line-dark);}
#summer .card .cat,#summer .card .vol{color:var(--paper-soft);}
#summer .card h3,#summer .card .price{color:var(--paper);}
#summer .card p{color:var(--paper-soft);}
#summer .card .icon{color:#EAD98C;}
#summer .card .meta{border-color:var(--line-dark);}

/* ---------- menu explorer ---------- */
#menu{padding:clamp(5rem,10vw,8rem) 0;}
.menu-head{max-width:52ch;margin-bottom:2.5rem;}
.menu-head h2{font-size:clamp(2.4rem,6vw,4rem);}
.pills{position:sticky;top:5.2rem;z-index:50;display:flex;gap:.6rem;flex-wrap:wrap;padding:1rem 0 1.3rem;background:var(--ivory);box-shadow:0 1.3rem 1rem -1rem rgba(36,24,17,.08);margin-bottom:1.5rem;}
.pill{
  font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.1rem;
  border:1px solid var(--line);border-radius:100px;color:var(--ink-soft);transition:all .3s;
}
.pill.active{background:var(--espresso);color:var(--paper);border-color:var(--espresso);}
.pill:hover{border-color:var(--caramel);color:var(--ink);}
.dark .pill{border-color:var(--line-dark);color:var(--paper-soft);}
.dark .pill.active{background:var(--paper);color:var(--espresso);border-color:var(--paper);}
.m-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.1rem;}
.m-card{
  grid-column:span 2;border:1px solid var(--line);border-radius:4px;padding:1.4rem;
  transition:border-color .3s,transform .3s;
}
.m-card.wide{grid-column:span 3;}
.m-card:hover{border-color:var(--caramel);transform:translateY(-3px);}
.m-card .cat{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--caramel);}
.m-card h3{font-size:1.08rem;margin-top:.45rem;}
.m-card p{font-size:.82rem;color:var(--ink-soft);margin-top:.4rem;min-height:2.6em;}
.m-card .meta{display:flex;justify-content:space-between;margin-top:.9rem;font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;}
.m-card .meta .vol{font-family:'Inter',sans-serif;font-size:.72rem;color:var(--ink-soft);align-self:center;}
@media (max-width:900px){.m-grid{grid-template-columns:repeat(2,1fr);}.m-card,.m-card.wide{grid-column:span 1;}}

/* ---------- atmosphere ---------- */
#atmosphere{position:relative;height:100svh;overflow:hidden;}
#atmo-panel{position:absolute;inset:-8%;background:#140D09;}
#atmo-panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65;}
#atmo-panel .tint{position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 25% 30%,rgba(184,122,61,.35),transparent 60%),
  radial-gradient(ellipse 55% 45% at 80% 75%,rgba(110,42,56,.4),transparent 60%),
  linear-gradient(180deg,rgba(20,13,9,.75),rgba(35,23,16,.8));
}
#atmosphere .copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6rem;}
#atmosphere h2{color:var(--paper);font-size:clamp(2.2rem,6vw,4.2rem);}
#atmosphere p{color:var(--paper-soft);letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;}

/* ---------- social ---------- */
#social{padding:clamp(5rem,10vw,8rem) 0;background:var(--linen);}
.social-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1.5rem;margin-bottom:3rem;}
.social-head h2{font-size:clamp(2.4rem,6vw,4.2rem);}
.ig-link{display:inline-flex;align-items:center;gap:.6rem;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:.3rem;}
.collage{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:70px;gap:.9rem;}
.tile{border-radius:4px;position:relative;overflow:hidden;transition:transform .4s cubic-bezier(.16,1,.3,1);background:#1D130E;}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.tile:hover{transform:scale(1.02) rotate(0deg) !important;z-index:2;}
.tile:nth-child(1){grid-column:1/6;grid-row:1/6;transform:rotate(-1.2deg);}
.tile:nth-child(2){grid-column:6/9;grid-row:1/4;transform:rotate(1.4deg);}
.tile:nth-child(3){grid-column:9/13;grid-row:1/5;transform:rotate(-.8deg);}
.tile:nth-child(4){grid-column:6/10;grid-row:4/8;transform:rotate(-1deg);}
.tile:nth-child(5){grid-column:1/6;grid-row:6/9;transform:rotate(.9deg);}
.tile:nth-child(6){grid-column:10/13;grid-row:5/9;transform:rotate(1.1deg);}
@media (max-width:760px){
  .collage{grid-template-columns:repeat(6,1fr);grid-auto-rows:110px;}
  .tile:nth-child(1){grid-column:1/4;grid-row:1/3;}
  .tile:nth-child(2){grid-column:4/7;grid-row:1/2;}
  .tile:nth-child(3){grid-column:4/7;grid-row:2/4;}
  .tile:nth-child(4){grid-column:1/4;grid-row:3/5;}
  .tile:nth-child(5){grid-column:1/7;grid-row:5/7;}
  .tile:nth-child(6){display:none;}
}

/* ---------- location / branches ---------- */
#location{padding:clamp(5rem,10vw,8rem) 0;}
.loc-head{max-width:60ch;margin-bottom:2.6rem;}
.loc-head h2{font-size:clamp(2.6rem,7vw,4.6rem);color:var(--paper);}
.loc-body{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(2rem,5vw,3.5rem);align-items:start;}
.loc-tabs{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.2rem;}
.loc-search{
  flex:1;min-width:160px;background:transparent;border:1px solid var(--line-dark);border-radius:100px;
  padding:.6rem 1.1rem;font-size:.82rem;color:var(--paper);
}
.loc-search::placeholder{color:var(--paper-soft);}
.loc-list{max-height:480px;overflow-y:auto;padding-right:.5rem;}
.loc-row{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
  padding:1rem 0;border-bottom:1px solid var(--line-dark);transition:opacity .2s;
}
.loc-row .loc-main{display:flex;flex-direction:column;gap:.15rem;}
.loc-row .loc-city{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--caramel-2);}
.loc-row .loc-addr{font-size:.95rem;color:var(--paper);}
.loc-row .loc-meta{display:flex;align-items:center;gap:1.1rem;font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--paper-soft);}
.loc-row .loc-phone:hover{color:var(--paper);}
.loc-row .loc-pin{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-dark);display:flex;align-items:center;justify-content:center;color:var(--paper-soft);transition:border-color .3s,color .3s;flex:none;}
.loc-row .loc-pin:hover{border-color:var(--caramel-2);color:var(--caramel-2);}
.loc-note{margin-top:1rem;font-size:.78rem;color:var(--paper-soft);opacity:.7;}
.map{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#140D09;border:1px solid var(--line-dark);}
#leaflet-map{position:absolute;inset:0;background:#140D09;}
.map .locate-wrap{position:absolute;left:.9rem;top:.9rem;z-index:500;display:flex;flex-direction:column;gap:.5rem;max-width:calc(100% - 1.8rem);}
.locate-btn{
  display:inline-flex;align-items:center;gap:.5rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  padding:.6rem 1rem;border-radius:100px;background:rgba(20,13,9,.78);backdrop-filter:blur(8px);
  border:1px solid var(--line-dark);color:var(--paper);transition:border-color .3s,background .3s;align-self:flex-start;
}
.locate-btn:hover{border-color:var(--caramel-2);}
.locate-btn svg{width:14px;height:14px;flex:none;}
.loc-status{font-size:.72rem;color:var(--paper-soft);background:rgba(20,13,9,.78);backdrop-filter:blur(8px);padding:.5rem .8rem;border-radius:8px;display:none;}
.loc-status.show{display:block;}
.pin-dot{width:14px;height:14px;position:relative;}
.pin-dot::before,.pin-dot::after{content:'';position:absolute;border-radius:50%;}
.pin-dot::before{inset:0;background:var(--caramel-2);}
.pin-dot::after{inset:-9px;border:1px solid var(--caramel-2);animation:pulse 2.4s ease-out infinite;}
.pin-dot.me{width:18px;height:18px;}
.pin-dot.me::before{background:var(--paper);}
.pin-dot.me::after{border-color:var(--paper);}
@keyframes pulse{0%{transform:scale(.6);opacity:.8;}100%{transform:scale(2.4);opacity:0;}}
.leaflet-popup-content-wrapper{background:var(--espresso-2);color:var(--paper);border-radius:6px;}
.leaflet-popup-tip{background:var(--espresso-2);}
.leaflet-popup-content{font-family:'Inter',sans-serif;font-size:.82rem;margin:.7rem .9rem;line-height:1.5;}
.leaflet-popup-content b{font-family:'Fraunces',serif;font-size:.95rem;display:block;margin-bottom:.2rem;}
.leaflet-control-attribution{background:rgba(20,13,9,.7) !important;color:var(--paper-soft) !important;font-size:.62rem !important;}
.leaflet-control-attribution a{color:var(--paper) !important;}
.leaflet-control-zoom a{background:rgba(20,13,9,.78) !important;color:var(--paper) !important;border-color:var(--line-dark) !important;}
@media (max-width:900px){.loc-body{grid-template-columns:1fr;}.map{aspect-ratio:16/10;}}

/* ---------- final cta ---------- */
#finalcta{padding:clamp(7rem,16vw,12rem) 0;text-align:center;background:var(--espresso);}
#finalcta h2{color:var(--paper);font-size:clamp(3rem,11vw,8rem);line-height:.92;}
#finalcta .tagline{font-family:'Fraunces',serif;font-style:italic;color:var(--paper-soft);font-size:clamp(1.1rem,2.5vw,1.5rem);margin-top:1.2rem;}
#finalcta .hero-ctas{justify-content:center;margin-top:2.8rem;}

/* ---------- footer ---------- */
footer{background:var(--espresso);padding:2.6rem 0 2.2rem;border-top:1px solid var(--line-dark);}
.foot-grid{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.4rem;}
.foot-grid .brand{font-family:'Fraunces',serif;color:var(--paper);font-size:1.2rem;}
.foot-links{display:flex;gap:1.6rem;flex-wrap:wrap;}
.foot-links a{font-size:.78rem;color:var(--paper-soft);}
.foot-links a:hover{color:var(--paper);}
.foot-bottom{margin-top:1.6rem;padding-top:1.4rem;border-top:1px solid var(--line-dark);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem;color:var(--paper-soft);font-size:.72rem;}

@media (max-width:820px){
  .intro-grid,.feat-grid{grid-template-columns:1fr;}
  .panel,.feat-panel{aspect-ratio:16/10;}
  .dessert-grid{gap:.8rem;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
}

/* ================= render: shelves & dessert grid & explorer ================= */
function shelfCard(item){
  return `<article class="card" data-cursor="view">
    <div class="icon">${icon(item.icon)}</div>
    <div class="cat">${T('cat_'+item.cat)}</div>
    <h3>${pick(item,'name')}</h3>
    <p>${pick(item,'desc')}</p>
    <div class="meta"><span class="price">${fmt(item.price)}</span><span class="vol">${item.vol}</span></div>
  </article>`;
}
function byCat(...cats){ return MENU.filter(i=>cats.includes(i.cat)); }
const dSizes = ["big","med","small","small","med","small","small","med","small"];

function renderShelves(){
  document.getElementById('coffee-shelf').innerHTML = byCat('coffee').map(shelfCard).join('');
  document.getElementById('bakery-shelf').innerHTML = byCat('croissants','bakery').map(shelfCard).join('');
  document.getElementById('breakfast-shelf').innerHTML = byCat('breakfast').map(shelfCard).join('');
  document.getElementById('summer-shelf').innerHTML = byCat('summer').map(shelfCard).join('');
  document.getElementById('dessert-grid').innerHTML = byCat('desserts').map((d,i)=>`
    <div class="d-card ${dSizes[i]||'small'}" data-cursor="view">
      <div class="glyph">${icon('dessert')}</div>
      <h3>${pick(d,'name')}</h3>
      <p>${pick(d,'desc')}</p>
      <div class="meta"><span>${fmt(d.price)}</span><span>${d.vol}</span></div>
    </div>`).join('');
}

const pillsEl = document.getElementById('pills');
const gridEl = document.getElementById('m-grid');
let activeCat = 'all';
function renderPills(){
  pillsEl.innerHTML = `<button class="pill${activeCat==='all'?' active':''}" data-cat="all">${T('pill_all')}</button>` +
    CAT_ORDER.map(k=>`<button class="pill${activeCat===k?' active':''}" data-cat="${k}">${T('cat_'+k)}</button>`).join('');
}
function renderGrid(){
  let wide = 0;
  gridEl.innerHTML = CAT_ORDER.map(k=>byCat(k).map(item=>{
    wide++;
    const cls = wide % 5 === 0 ? ' wide' : '';
    const show = activeCat==='all' || activeCat===k;
    return `<div class="m-card${cls}" data-cat="${k}" data-cursor="view" style="${show?'':'display:none'}">
      <div class="cat">${T('cat_'+k)}</div>
      <h3>${pick(item,'name')}</h3>
      <p>${pick(item,'desc')}</p>
      <div class="meta"><span>${fmt(item.price)}</span><span class="vol">${item.vol}</span></div>
    </div>`;
  }).join('')).join('');
}
pillsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.pill'); if(!btn) return;
  const cat = btn.dataset.cat;
  const cards = [...gridEl.children];
  const first = new Map(cards.map(c=>[c,c.getBoundingClientRect()]));
  activeCat = cat;
  pillsEl.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active', p.dataset.cat===cat));
  cards.forEach(c=>{ c.style.display = (cat==='all' || c.dataset.cat===cat) ? '' : 'none'; });
  if(window.gsap && !reduce){
    cards.forEach(c=>{
      if(c.style.display==='none') return;
      const f = first.get(c), l = c.getBoundingClientRect();
      const dx = f.left-l.left, dy=f.top-l.top;
      gsap.fromTo(c,{x:dx,y:dy,opacity:.3},{x:0,y:0,opacity:1,duration:.6,ease:'power3.out'});
    });
  }
});

/* ================= render: branches directory ================= */
let activeTab = 'tashkent';
const locListEl = document.getElementById('loc-list');
const locSearchEl = document.getElementById('loc-search');
function branchAddr(b){ return b['addr'+({en:'En',ru:'Ru',uz:'Uz'}[LANG])]; }
function branchCity(b){ return b['city'+({en:'En',ru:'Ru',uz:'Uz'}[LANG])]; }
function renderBranches(){
  const term = (locSearchEl.value||'').trim().toLowerCase();
  const rows = BRANCHES.filter(b=>b.region===activeTab).filter(b=>{
    if(!term) return true;
    return (branchAddr(b)+' '+branchCity(b)).toLowerCase().includes(term);
  });
  locListEl.innerHTML = rows.map(b=>{
    const mapsQ = encodeURIComponent(b.addrEn+', '+b.cityEn+', Uzbekistan');
    const tel = '+'+b.phone.replace(/\D/g,'');
    return `<div class="loc-row">
      <div class="loc-main">
        <span class="loc-city">${branchCity(b)}</span>
        <span class="loc-addr">${branchAddr(b)}</span>
      </div>
      <div class="loc-meta">
        <span>${b.hours}</span>
        <a class="loc-phone" href="tel:${tel}">${b.phone}</a>
        <a class="loc-pin" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}" target="_blank" rel="noopener" aria-label="Directions">${icon('pin')}</a>
      </div>
    </div>`;
  }).join('') || `<div class="loc-row"><div class="loc-main"><span class="loc-addr">—</span></div></div>`;
}
document.querySelectorAll('.loc-tabs .pill').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.loc-tabs .pill').forEach(p=>p.classList.toggle('active', p===btn));
    renderBranches();
  });
});
locSearchEl.addEventListener('input', renderBranches);

/* ================= live map: real OSM tiles + geolocation + nearest branch ================= */
let leafletMap, markersLayer, userMarker;
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function branchPopupHtml(b){
  const approx = b.approx ? ` <span style="opacity:.6">${T('loc_approx')}</span>` : '';
  return `<b>${branchCity(b)}</b>${branchAddr(b)}${approx}<br>${b.hours}`;
}
function initMap(){
  if(!window.L || !document.getElementById('leaflet-map')) return;
  leafletMap = L.map('leaflet-map', {zoomControl:true, scrollWheelZoom:false}).setView([41.31,69.28], 6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom:19, subdomains:'abcd'
  }).addTo(leafletMap);
  markersLayer = L.layerGroup().addTo(leafletMap);
  BRANCHES.forEach(b=>{
    if(b.lat==null) return;
    const icon = L.divIcon({className:'', html:'<div class="pin-dot"></div>', iconSize:[14,14], iconAnchor:[7,7]});
    b._marker = L.marker([b.lat,b.lon], {icon}).addTo(markersLayer).bindPopup(branchPopupHtml(b));
  });
  const pts = BRANCHES.filter(b=>b.lat!=null).map(b=>[b.lat,b.lon]);
  if(pts.length) leafletMap.fitBounds(L.latLngBounds(pts).pad(0.2));
}
function refreshPopups(){
  BRANCHES.forEach(b=>{ if(b._marker) b._marker.setPopupContent(branchPopupHtml(b)); });
}
function locateMe(){
  const statusEl = document.getElementById('loc-status');
  statusEl.classList.add('show');
  if(!navigator.geolocation){ statusEl.textContent = T('loc_unsupported'); return; }
  statusEl.textContent = T('loc_locating');
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    if(userMarker) leafletMap.removeLayer(userMarker);
    const icon = L.divIcon({className:'', html:'<div class="pin-dot me"></div>', iconSize:[18,18], iconAnchor:[9,9]});
    userMarker = L.marker([lat,lon], {icon, zIndexOffset:1000}).addTo(leafletMap);
    let nearest=null, nearestDist=Infinity;
    BRANCHES.forEach(b=>{
      if(b.lat==null) return;
      const d = haversineKm(lat,lon,b.lat,b.lon);
      if(d<nearestDist){ nearestDist=d; nearest=b; }
    });
    if(nearest){
      leafletMap.fitBounds(L.latLngBounds([[lat,lon],[nearest.lat,nearest.lon]]).pad(0.35));
      nearest._marker.openPopup();
      statusEl.innerHTML = `<b>${T('loc_nearest')}:</b> ${branchCity(nearest)}, ${branchAddr(nearest)} — ${nearestDist.toFixed(1)} ${T('loc_km_away')}`;
    }
  }, ()=>{ statusEl.textContent = T('loc_denied'); }, {enableHighAccuracy:true, timeout:10000});
}
document.getElementById('locate-btn').addEventListener('click', locateMe);
initMap();

/* ================= apply language ================= */
function applyLang(lang){
  LANG = I18N[lang] ? lang : 'uz';
  localStorage.setItem('bonLang', LANG);
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  document.getElementById('loc-search').placeholder = T('search_ph');
  document.querySelectorAll('.langsw button').forEach(b=>b.classList.toggle('active', b.dataset.lang===LANG));
  const track = document.getElementById('marquee-track');
  const span = `<span>${T('marquee')} <i></i></span>`;
  track.innerHTML = span+span+span+span;
  renderPills();
  renderShelves();
  renderGrid();
  renderBranches();
  if(typeof refreshPopups === 'function') refreshPopups();
}
document.querySelectorAll('.langsw button').forEach(btn=>{
  btn.addEventListener('click', ()=>applyLang(btn.dataset.lang));
});
applyLang(LANG);

/* ---------- preloader ---------- */
window.addEventListener('load', ()=>{
  setTimeout(()=>{ document.getElementById('preloader').classList.add('hide'); }, reduce?50:1500);
});

/* ---------- guard against mobile Safari's scroll-anchor drift on the horizontal shelves ---------- */
function resetShelves(){ document.querySelectorAll('.shelf').forEach(s=>{ s.scrollLeft = 0; }); }
resetShelves();
window.addEventListener('load', resetShelves);
window.addEventListener('orientationchange', resetShelves);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(resetShelves); }

/* ---------- nav scroll morph ---------- */
const nav = document.getElementById('nav');
window.addEventListener('scroll', ()=>{
  nav.classList.toggle('scrolled', window.scrollY > 80);
}, {passive:true});

/* ---------- custom cursor ---------- */
if(!coarse){
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  const label = document.getElementById('cursor-label');
  let mx=0,my=0,rx=0,ry=0;
  window.addEventListener('mousemove', e=>{ mx=e.clientX; my=e.clientY; dot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`; });
  function raf(){ rx += (mx-rx)*.16; ry += (my-ry)*.16; ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`; requestAnimationFrame(raf); }
  raf();
  document.addEventListener('mouseover', e=>{
    const el = e.target.closest('[data-cursor]');
    if(!el){ ring.classList.remove('expand'); label.textContent=''; return; }
    ring.classList.add('expand');
    label.textContent = el.dataset.cursor === 'view' ? T('cursor_view') : el.dataset.cursor==='cta' ? '' : T('cursor_explore');
    ring.classList.toggle('on-dark', !!el.closest('.dark, #hero, #finalcta, #location'));
  });
}else{
  document.getElementById('cursor-dot').remove();
  document.getElementById('cursor-ring').remove();
}

/* ---------- hero cursor parallax ---------- */
const heroLayer = document.getElementById('hero-parallax');
if(!coarse && !reduce){
  document.getElementById('hero').addEventListener('mousemove', e=>{
    const x = (e.clientX/window.innerWidth-.5)*20;
    const y = (e.clientY/window.innerHeight-.5)*14;
    heroLayer.style.transform = `translate(${x}px,${y}px)`;
  });
}

/* ---------- reveal on scroll ---------- */
if('IntersectionObserver' in window){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:.15, rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));
}else{
  document.querySelectorAll('[data-reveal]').forEach(el=>el.classList.add('in'));
}

/* ---------- gsap scrub parallax on decorative shapes ---------- */
if(window.gsap && window.ScrollTrigger && !reduce){
  gsap.registerPlugin(ScrollTrigger);
  gsap.utils.toArray('.steam').forEach((el,i)=>{
    gsap.to(el, {
      y: i===0? -60:60, ease:'none',
      scrollTrigger:{ trigger:'#hero', start:'top top', end:'bottom top', scrub:.6 }
    });
  });
  gsap.to('#atmo-panel', {
    scale:1.12, ease:'none',
    scrollTrigger:{ trigger:'#atmosphere', start:'top bottom', end:'bottom top', scrub:.6 }
  });
}
})();
</script>
